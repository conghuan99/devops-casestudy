server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: flask-app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: flask-app
          __path__: /var/log/containers/*.log
    pipeline_stages:
      - docker: {}
      - regex:
          # parse tên file ra pod, namespace, container
          expression: '/var/log/containers/(?P<pod>[^_]+)_(?P<namespace>[^_]+)_(?P<container>[^-]+)'
          source: filename
      - labels:
          pod:
          namespace:
          container:
